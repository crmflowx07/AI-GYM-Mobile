name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ["App.js","src/**","app.json","package.json",".github/workflows/build-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: npm install
      - run: npx expo-doctor || true
      - run: npx expo prebuild --platform android --clean --no-install
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AI-GYM-PRO-V8.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AI-GYM-PRO-V8-APK
          path: AI-GYM-PRO-V8.apk
          retention-days: 30
