name: Publish Direct APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ["App.js","src/**","app.json","package.json",".github/workflows/release-apk.yml"]
permissions:
  contents: write
jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: npm install
      - run: npx expo prebuild --platform android --clean --no-install
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AI-GYM-PRO-V10.apk
      - name: Publish or update direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v10-latest >/dev/null 2>&1 || gh release create v10-latest --title "AI GYM PRO V10" --notes "Latest installable Android APK built from main."
          gh release upload v10-latest AI-GYM-PRO-V10.apk --clobber
